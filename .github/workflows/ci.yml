name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [prd, hml]
  push:
    branches: [prd, hml]

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Valida branch de DEV
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|fix|hotfix|docs|chore|refactor|test)/[a-z0-9._-]+$ ]]; then
            echo "::error::Branch $HEAD_REF fora do padrao <tipo>/<descricao>. PRs para prd/hml saem de uma branch de DEV criada a partir de prd."
            exit 1
          fi
          if [[ "$BASE_REF" == "prd" ]] && [[ -n "$(comm -12 <(git rev-list --merges origin/prd..origin/hml | sort) <(git rev-list origin/prd.."$HEAD_SHA" | sort))" ]]; then
            echo "::error::A branch contem commits de hml. Recrie a branch a partir de prd sem mergear hml nela."
            exit 1
          fi

  deploy-hml:
    if: github.event_name == 'push' && github.ref_name == 'hml'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homologacao
    permissions: {}
    steps:
      - name: Publica na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/chess-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/chess-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/chess-ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/chess-ssh/known_hosts" \
            -i "$RUNNER_TEMP/chess-ssh/key" chess@72.60.4.150 "deploy-$GITHUB_REF_NAME"

  deploy-hostinger:
    if: github.ref == 'refs/heads/prd' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hostinger-prd
    concurrency: chess-hostinger-prd
    permissions: {}
    steps:
      - name: Ativa a revisão preparada na Hostinger
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$REVISION" =~ ^[0-9a-f]{64}$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/chess-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          vps=$(cut -d ' ' -f1 "$ssh_dir/known_hosts")
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -i "$ssh_dir/key" "chess-actions@$vps" "deploy-chess $REVISION"

  build:
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Identifica a revisão da aplicação
        id: revision
        run: |
          set -euo pipefail
          revision=$(git ls-tree -r --full-tree HEAD |
            LC_ALL=C awk -F '\t' '$2 !~ /^\.github\// && $2 != "README.md" && $2 != "LICENSE"' |
            sha256sum | cut -d ' ' -f1)
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: ES2-Chess-Game/chess-backend
          ref: fa1efb0827293c225427dbb35b048cde148c7f5d
          path: system-backend
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Instala o Chromium para os testes de sistema
        run: npx playwright install --with-deps chromium
      - name: Testa a partida no navegador com a API real
        timeout-minutes: 7
        run: |
          set -euo pipefail
          (cd system-backend && ./gradlew --no-daemon bootJar)
          java -jar system-backend/build/libs/*SNAPSHOT.jar --server.address=127.0.0.1 --server.port=8080 > "$RUNNER_TEMP/chess-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! curl --silent --fail --retry 25 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:8080/api/avatares > /dev/null; then
            tail -60 "$RUNNER_TEMP/chess-api.log"
            exit 1
          fi
          npm run test:e2e
